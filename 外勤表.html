<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外勤表</title>
<script src="https://unpkg.com/lucide@latest">
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6f8;--surface:#fff;--border:#e0e2e6;--text:#1d1d1f;--text-secondary:#6b6e74;--primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#eff3fe;--danger:#dc2626;--danger-light:#fef2f2;--success:#16a34a;--warning:#d97706;--warning-light:#fffbeb;--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.06)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:14px}
.header h1{font-size:17px;font-weight:600;white-space:nowrap}
.tab-bar{display:flex;background:var(--bg);border-radius:var(--radius);padding:3px;gap:2px}
.tab-btn{border:none;background:transparent;padding:5px 12px;border-radius:4px;font-size:13px;cursor:pointer;color:var(--text-secondary);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.tab-btn svg{width:15px;height:15px}
.header-actions{display:flex;align-items:center;gap:6px}
.container{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.view{display:none}
.view.active{display:block}

/* Calendar */
.cal-layout{display:flex;gap:16px;align-items:flex-start}
.cal-main{flex:1;min-width:0}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-header h2{font-size:18px;font-weight:600;min-width:160px;text-align:center}
.cal-nav{display:flex;gap:4px}
.cal-nav button{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:6px 10px;cursor:pointer;display:flex;align-items:center;color:var(--text);font-size:13px}
.cal-nav button:hover{background:var(--bg)}
.cal-nav button svg{width:16px;height:16px}
.cal-grid{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.cal-weekdays div{padding:8px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--text-secondary)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{position:relative;min-height:68px;padding:5px 7px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;min-width:32px}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--primary-light)}
.cal-cell.other-month{background:#fafafa}
.cal-cell.other-month .cal-day-num{color:#c0c2c6}
.cal-cell.today{background:var(--primary-light)}
.cal-cell.selected{background:var(--primary);color:#fff}
.cal-cell.selected .cal-day-num{color:#fff;font-weight:600}
.cal-day-num{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.cal-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.cal-cell .todo-dot{background:var(--warning)}
.cal-cell .record-count{font-size:10px;color:var(--text-secondary);margin-top:1px}
.cal-cell.selected .record-count{color:rgba(255,255,255,.7)}
.cal-cell.drag-over{background:#dbeafe!important;outline:2px dashed var(--primary);outline-offset:-2px}
.cal-cell.drag-over .cal-day-num{color:var(--primary);font-weight:700}

/* Day panel */
.day-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:14px;padding:16px}
.day-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.day-panel-header h3{font-size:15px;font-weight:600}
.day-records .empty-day{text-align:center;padding:24px 0;color:var(--text-secondary);font-size:13px}
.day-record-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.day-record-item:last-child{border-bottom:none}
.day-record-item .r-icon{flex-shrink:0;width:32px;height:32px;border-radius:var(--radius);background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.day-record-item .r-icon svg{width:16px;height:16px}
.day-record-item .r-body{flex:1;min-width:0}
.day-record-item .r-title{font-weight:500;font-size:13px}
.day-record-item .r-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.day-record-item .r-actions button{border:none;background:transparent;cursor:pointer;padding:4px;border-radius:4px;color:var(--text-secondary);display:flex}
.day-record-item .r-actions button:hover{background:var(--bg);color:var(--text)}
.day-record-item .r-actions button.del:hover{color:var(--danger);background:var(--danger-light)}

/* Todo Panel */
.cal-todo-panel{width:250px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:sticky;top:74px;max-height:calc(100vh-90px);overflow-y:auto}
.cal-todo-head{font-size:14px;font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.cal-todo-input-row{display:flex;gap:6px;margin-bottom:8px}
.cal-todo-input-row input[type=text]{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none}
.cal-todo-input-row input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.cal-todo-list{min-height:40px}
.cal-todo-item{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--border);cursor:grab;user-select:none}
.cal-todo-item:last-child{border-bottom:none}
.cal-todo-item:active{cursor:grabbing}
.cal-todo-item:hover{background:var(--bg);border-radius:4px}
.cal-todo-item.dragging{opacity:.3}
.cal-todo-item .ct-text{flex:1;font-size:13px;line-height:1.3;word-break:break-word;min-width:0}
.cal-todo-item .ct-complete{border:none;background:transparent;cursor:pointer;padding:3px;border-radius:4px;color:var(--text-secondary);display:flex;flex-shrink:0;transition:all .15s}
.cal-todo-item .ct-complete:hover{color:var(--success);background:var(--success-light)}
.cal-todo-item .ct-complete svg{width:16px;height:16px}
.cal-todo-stats{display:flex;gap:10px;padding:6px 0 2px;font-size:11px;color:var(--text-secondary);border-top:1px solid var(--border);margin-top:4px}
.cal-todo-stats strong{color:var(--text);font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--danger-light)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn svg{width:15px;height:15px}
.btn-sm svg{width:13px;height:13px}

/* Records */
.records-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.records-toolbar .toolbar-left{display:flex;align-items:center;gap:8px}
.records-toolbar .toolbar-right{display:flex;align-items:center;gap:8px}
.search-box{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.search-box svg{width:15px;height:15px;color:var(--text-secondary)}
.search-box input{border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;color:var(--text);width:160px}
.stats-bar{display:flex;gap:16px;margin-bottom:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text-secondary)}
.stats-bar strong{color:var(--text);font-weight:600}
.record-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.record-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.record-card .name-date{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.record-card .name-date .name{font-weight:600;font-size:14px}
.record-card .card-actions{display:flex;gap:4px;flex-shrink:0}
.record-card .card-body{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;color:var(--text-secondary)}
.record-card .card-body .label{color:var(--text-secondary);white-space:nowrap}
.record-card .card-body .value{color:var(--text)}
.record-card .card-body .desc{grid-column:1/-1;margin-top:5px;padding:7px 9px;background:var(--bg);border-radius:var(--radius);font-size:13px;color:var(--text)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-secondary)}
.empty-state svg{width:44px;height:44px;margin-bottom:10px;opacity:.4}
.empty-state p{font-size:14px}

/* Toast */
.toast-container{position:fixed;top:14px;right:14px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:9px 14px;border-radius:var(--radius);font-size:13px;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;animation:slideIn .2s}
.toast-success{border-left:3px solid var(--success)}
.toast-error{border-left:3px solid var(--danger)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media print{.header,.tab-bar,.card-actions,.records-toolbar,.stats-bar{display:none!important}.view{display:block!important}.container{max-width:100%;padding:0}.record-card{break-inside:avoid;border:1px solid #ccc}body{background:#fff}}
@media(max-width:820px){.cal-layout{flex-direction:column}.cal-todo-panel{width:100%;position:static;max-height:none}}
@media(max-width:700px){.header{padding:8px 12px}.header h1{font-size:15px}.container{padding:12px 10px 40px}.records-toolbar{flex-direction:column;align-items:stretch}.search-box input{width:110px}.stats-bar{flex-wrap:wrap;gap:6px}.cal-cell{min-height:50px;padding:4px 5px}.tab-bar{flex-wrap:wrap}}
@media(max-width:500px){.cal-cell{min-height:40px;padding:3px 4px}.cal-day-num{font-size:11px}.cal-dot{width:4px;height:4px}}


/* Modal */


/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:12px;padding:0;width:440px;max-width:94%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:80vh;overflow:hidden;border:1px solid rgba(0,0,0,.06)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;font-weight:600;margin:0;color:var(--text)}
.modal-close{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--text-secondary);display:flex;transition:all .15s}
.modal-close:hover{color:var(--text);background:var(--bg)}
.modal-close svg{width:20px;height:20px}
.modal-body{padding:20px 24px 16px;overflow-y:auto;max-height:calc(80vh-120px)}
.modal-body .form-group label{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:none;letter-spacing:0}
.modal-body .form-group input,.modal-body .form-group textarea{font-size:15px;padding:10px 12px;border-radius:8px;border-color:var(--border)}
.modal-body .form-group input:focus,.modal-body .form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.modal-body .form-group textarea{min-height:72px;font-size:15px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 20px;border-top:1px solid var(--border)}
.modal-foot .btn{font-size:14px;padding:9px 20px;border-radius:8px}
.modal-foot .btn-primary{font-weight:500}



/* Watermark */
.watermark{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.35;pointer-events:none;user-select:none}
.watermark img{width:48px;height:48px;border-radius:50%}
.watermark span{font-size:11px;color:var(--text-secondary);letter-spacing:1px;font-weight:500}
@media print{.watermark{display:none}}
.watermark{position:fixed;bottom:12px;right:12px;z-index:9999;opacity:.3;pointer-events:none}.watermark img{width:40px;height:40px;border-radius:50%;display:block;margin:0 auto 2px}.watermark span{display:block;font-size:10px;color:#666;text-align:center;letter-spacing:1px}
@media print{.watermark{display:none}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>外勤表</h1>
    <div class="tab-bar">
      <button class="tab-btn active" data-view="calendar" title="日历"><i data-lucide="calendar"></i> 日历</button>
      <button class="tab-btn" data-view="records" title="记录"><i data-lucide="history"></i> 记录</button>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-sm" onclick="exportCSV()" title="导出 CSV"><i data-lucide="download"></i> 导出</button>
    <button class="btn btn-sm" onclick="window.print()" title="打印"><i data-lucide="printer"></i></button>
  </div>
</div>
<div class="container">

  <!-- Calendar View -->
  <div id="view-calendar" class="view active">
    <div class="cal-layout">
      <div class="cal-main">
        <div class="cal-header">
          <button class="btn btn-sm" onclick="calGo(-1)" title="上月"><i data-lucide="chevron-left"></i></button>
          <h2 id="cal-title">-</h2>
          <div class="cal-nav">
            <button onclick="calToday()" title="今天">今天</button>
            <button onclick="calGo(1)" title="下月"><i data-lucide="chevron-right"></i></button>
          </div>
        </div>
        <div class="cal-grid">
          <div class="cal-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
          <div class="cal-days" id="cal-days"></div>
        </div>
        <div class="day-panel">
          <div class="day-panel-header">
            <h3 id="day-panel-title">选择日期查看详情</h3>
          </div>
          <div id="day-records" class="day-records"><div class="empty-day">点击日历中的日期查看当日外勤记录</div></div>
        </div>
      </div>
      <div class="cal-todo-panel">
        <div class="cal-todo-head">快速外勤</div>
        <button class="btn btn-sm btn-primary" onclick="openQuickRecord()" style="width:100%;margin-bottom:10px;justify-content:center"><i data-lucide="plus"></i> 新增外勤</button>
        <div class="cal-todo-list" id="quick-records-list">
          <div class="empty-state" style="padding:20px 0"><p>暂无记录</p></div>
        </div>
        <div class="cal-todo-stats">
          <span>共 <strong id="quick-record-count">0</strong> 条</span>
        </div>
      </div></div>
    </div>
  </div>

  <!-- Records View -->
  <div id="view-records" class="view">
    <div class="records-toolbar">
      <div class="toolbar-left">
        <div class="search-box"><i data-lucide="search"></i><input type="text" id="search-input" placeholder="搜索姓名/地点" oninput="renderRecords()"></div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-sm" onclick="exportCSV()" title="导出 CSV"><i data-lucide="download"></i> 导出</button>
        <button class="btn btn-sm btn-danger" onclick="clearAllRecords()" title="清空"><i data-lucide="trash-2"></i></button>
      </div>
    </div>
    <div class="stats-bar"><span>共 <strong id="total-count">0</strong> 条记录</span></div>
    <div id="records-list"></div>
  </div>

</div>


<!-- Quick Record Modal -->
<div class="modal-overlay" id="quick-modal">
  <div class="modal">
    <div class="modal-head">
      <h2>新增外勤记录</h2>
      <button class="modal-close" onclick="closeQuickRecord()" title="关闭"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-grid" style="grid-template-columns:1fr">
        <div class="form-group"><label>姓名</label><input type="text" id="quick-name" placeholder="请输入姓名"></div>
        <div class="form-group"><label>外勤地点</label><input type="text" id="quick-location" placeholder="例如：客户公司、现场地址"></div>
        <div class="form-group full-width"><label>备注</label><textarea id="quick-note" placeholder="填写说明" style="min-height:60px"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeQuickRecord()">取消</button>
      <button class="btn btn-primary" onclick="saveQuickRecord()"><i data-lucide="check"></i> 保存</button>
    </div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>

<script>
var RECORDS_KEY='waiqin_records',TODOS_KEY='waiqin_todos';
function getRecords(){try{return JSON.parse(localStorage.getItem(RECORDS_KEY))||[]}catch(e){return[]}}
function saveRecords(r){localStorage.setItem(RECORDS_KEY,JSON.stringify(r))}
function getTodos(){try{return JSON.parse(localStorage.getItem(TODOS_KEY))||[]}catch(e){return[]}}
function saveTodos(t){localStorage.setItem(TODOS_KEY,JSON.stringify(t))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(d){if(!d)return'';var p=d.split('-');return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日'}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toast(msg,t){if(t===undefined)t='success';var c=document.getElementById('toast-container');var e=document.createElement('div');e.className='toast toast-'+t;e.textContent=msg;c.appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){e.remove()},300)},2500)}

document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById('view-'+b.dataset.view).classList.add('active');if(b.dataset.view==='records')renderRecords();if(b.dataset.view==='calendar'){renderCalendar();renderQuickRecords()}})})

/* Calendar */
var calYear,calMonth,calSel=null;
function renderCalendar(){var n=new Date();if(calYear===undefined){calYear=n.getFullYear();calMonth=n.getMonth()}document.getElementById('cal-title').textContent=calYear+'年 '+(calMonth+1)+'月';var recs=getRecords(),todos=getTodos(),map={};recs.forEach(function(r){if(!r.date)return;if(!map[r.date])map[r.date]={r:[],t:[]};map[r.date].r.push(r)});todos.forEach(function(t){if(!t.dueDate)return;if(!map[t.dueDate])map[t.dueDate]={r:[],t:[]};map[t.dueDate].t.push(t)});var fd=new Date(calYear,calMonth,1).getDay(),dim=new Date(calYear,calMonth+1,0).getDate(),dip=new Date(calYear,calMonth,0).getDate();var td=today(),html='';for(var i=fd-1;i>=0;i--){var d=dip-i;html+=cell(pad(calYear,calMonth-1,d),d,1,false,map[pad(calYear,calMonth-1,d)])}for(var d=1;d<=dim;d++){var ds=pad(calYear,calMonth,d);html+=cell(ds,d,0,ds===td,map[ds],ds===calSel)}var tc=fd+dim,rm=(7-(tc%7))%7;for(var i=1;i<=rm;i++){var ds=pad(calYear,calMonth+1,i);html+=cell(ds,i,1,false,map[ds])}document.getElementById('cal-days').innerHTML=html;if(calSel)showDay(calSel);else if(map[td]){calSel=td;showDay(td)}else{document.getElementById('day-panel-title').textContent='选择日期查看详情';document.getElementById('day-records').innerHTML='<div class="empty-day">点击日历中的日期查看当日外勤记录</div>'}if(typeof lucide!=='undefined')lucide.createIcons()}

function cell(ds,num,other,isToday,data,isSel){var c='cal-cell'+(other?' other-month':'')+(isToday?' today':'')+(isSel?' selected':'');var dots='';if(data){for(var i=0;i<Math.min(data.r.length,3);i++)dots+='<span class="cal-dot"></span>';if(data.t.filter(function(t){return!t.completed}).length>0)dots+='<span class="cal-dot todo-dot"></span>'}var cs=data&&data.r.length>0?'<div class="record-count">'+data.r.length+'条</div>':'';return '<div class="'+c+'" onclick="selDate(\''+ds+'\')" ondragover="dragOverCal(event)" ondragleave="dragLeaveCal(event)" ondrop="dropOnCal(event,\''+ds+'\')"><div class="cal-day-num">'+num+'</div><div class="cal-dots">'+dots+'</div>'+cs+'</div>'}

function pad(y,m,d){var dt=new Date(y,m,d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function calGo(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}renderCalendar()}
function calToday(){var n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();calSel=today();renderCalendar();var s=document.querySelector('.cal-cell.selected');if(s)s.scrollIntoView({block:'nearest'})}
function selDate(ds){calSel=ds;renderCalendar();showDay(ds)}

function showDay(ds){var recs=getRecords();var todos=getTodos().filter(function(t){return t.dueDate===ds&&!t.completed});var dt=new Date(ds),wd=['日','一','二','三','四','五','六'];document.getElementById('day-panel-title').textContent=fmtDate(ds)+' 星期'+wd[dt.getDay()];var c=document.getElementById('day-records'),html='';if(todos.length>0)html+='<div style="margin-bottom:8px;font-size:12px;color:var(--warning)"><i data-lucide="check-square" style="width:13px;height:13px;vertical-align:middle"></i> 待办 '+todos.length+' 项</div>';if(recs.length===0&&todos.length===0){html+='<div class="empty-day">当日无外勤记录</div>'}recs.forEach(function(r){html+='<div class="day-record-item"><div class="r-icon"><i data-lucide="map-pin"></i></div><div class="r-body"><div class="r-title">'+esc(r.name)+'</div><div class="r-meta">'+esc(r.location||'—')+'</div></div></div>'});c.innerHTML=html;if(typeof lucide!=='undefined')lucide.createIcons()}

/* Render Records */
function renderRecords(){var r=getRecords(),s=document.getElementById('search-input').value.trim().toLowerCase();if(s)r=r.filter(function(x){return x.name.toLowerCase().includes(s)||x.location.toLowerCase().includes(s)});document.getElementById('total-count').textContent=r.length;var l=document.getElementById('records-list');if(r.length===0){l.innerHTML='<div class="empty-state"><i data-lucide="file-text" style="width:44px;height:44px;opacity:.4"></i><p>暂无外勤记录</p></div>';if(typeof lucide!=='undefined')lucide.createIcons();return}l.innerHTML=r.map(function(x){var nh=x.note?'<br><br><strong>备注：</strong>'+esc(x.note):'';return '<div class="record-card"><div class="record-card-header"><div class="name-date"><span class="name">'+esc(x.name)+'</span></div></div><div class="card-body"><span class="label">地点</span><span class="value">'+esc(x.location)+'</span><div class="desc">'+esc(x.note||'')+'</div></div></div>'}).join('');if(typeof lucide!=='undefined')lucide.createIcons()}

function clearAllRecords(){if(!confirm('确定要清空所有记录吗？'))return;saveRecords([]);renderCalendar();if(document.getElementById('view-records').classList.contains('active'))renderRecords();toast('已清空')}

/* Export */
function exportCSV(){var r=getRecords();if(!r.length){toast('暂无记录可导出','error');return}var h='姓名,地点,备注,创建时间';var b=r.map(function(x){return[x.name,x.location||'',x.note||'',x.createdAt||''].map(function(c){var s=String(c||'');return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')}).join('\n');var blob=new Blob(['\uFEFF'+h+'\n'+b],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='外勤记录_'+today()+'.csv';a.click();URL.revokeObjectURL(url);toast('CSV已导出')}

/* Quick Record */
var quickNameInput=document.getElementById('quick-name'),quickLocInput=document.getElementById('quick-location'),quickNoteInput=document.getElementById('quick-note'),quickModal=document.getElementById('quick-modal');
function openQuickRecord(){if(quickModal)quickModal.classList.add('open');if(quickNameInput)quickNameInput.value='';if(quickLocInput)quickLocInput.value='';if(quickNoteInput)quickNoteInput.value='';if(quickNameInput)setTimeout(function(){quickNameInput.focus()},100)}
if(quickModal)quickModal.addEventListener('click',function(e){if(e.target===e.currentTarget)closeQuickRecord()});
function closeQuickRecord(){if(quickModal)quickModal.classList.remove('open')}
function saveQuickRecord(){var n=quickNameInput?quickNameInput.value.trim():'',lo=quickLocInput?quickLocInput.value.trim():'',no=quickNoteInput?quickNoteInput.value.trim():'';if(!n){toast('请输入姓名','error');if(quickNameInput)quickNameInput.focus();return}if(!lo){toast('请输入外勤地点','error');if(quickLocInput)quickLocInput.focus();return}closeQuickRecord();var rec={id:genId(),name:n,location:lo,note:no,completed:false,createdAt:new Date().toISOString()};var r=getRecords();r.unshift(rec);saveRecords(r);renderQuickRecords();renderCalendar();toast('外勤记录已提交')}function renderQuickRecords(){var all=getRecords();var r=all.filter(function(x){return!x.completed});var c=document.getElementById('quick-record-count');if(c)c.textContent=all.length;var l=document.getElementById('quick-records-list');if(!l)return;if(r.length===0){l.innerHTML='<div class="empty-state" style="padding:20px 0"><p>全部已完成</p></div>';if(typeof lucide!=='undefined')lucide.createIcons();return}var html='';for(var i=0;i<Math.min(r.length,50);i++){html+='<div class="cal-todo-item" draggable="true" ondragstart="dragRecordStart(event,\''+r[i].id+'\')" ondragend="dragRecordEnd(event)"><span class="ct-text">'+esc(r[i].name)+'</span><span style="font-size:11px;color:var(--text-secondary);flex-shrink:0;margin-right:4px">'+esc(r[i].location||'')+'</span><button class="ct-complete" onclick="completeRecord(\''+r[i].id+'\')" title="已完成"><i data-lucide="check-circle-2"></i></button></div>'}l.innerHTML=html;if(typeof lucide!=='undefined')lucide.createIcons()}
function completeRecord(id){if(!confirm('标记为已完成？'))return;var r=getRecords(),x=r.find(function(x){return x.id===id});if(!x)return;x.completed=true;saveRecords(r);renderQuickRecords();renderCalendar();toast('已完成')}

function dragRecordStart(e,id){e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';setTimeout(function(){e.target.classList.add('dragging')},0)}
function dragRecordEnd(e){e.target.classList.remove('dragging')}
/* Drag & Drop */
function dragTodoStart(e,id){e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';setTimeout(function(){e.target.classList.add('dragging')},0)}
function dragTodoEnd(e){e.target.classList.remove('dragging')}
function dragOverCal(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')}
function dragLeaveCal(e){e.currentTarget.classList.remove('drag-over')}
function dropOnCal(e,ds){e.preventDefault();e.currentTarget.classList.remove('drag-over');var id=e.dataTransfer.getData('text/plain');if(!id)return;var r=getRecords(),x=r.find(function(x){return x.id===id});if(!x)return;if(x.date)x.date=ds;else{x.date=ds||today()}saveRecords(r);renderCalendar();renderQuickRecords();toast('已安排到 '+fmtDate(ds))}

/* Init */
document.addEventListener('DOMContentLoaded',function(){if(typeof lucide!=='undefined')lucide.createIcons();renderCalendar();calRenderTodos()});
</script>
